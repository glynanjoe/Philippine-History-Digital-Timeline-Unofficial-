
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Philippine History Digital Timeline{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo">
            <span class="logo-icon">PH</span>
            <span class="logo-text">
                <strong>PHILIPPINE HISTORY</strong>
                <small>A DIGITAL TIMELINE</small>
            </span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Historical Timeline</a>
            <a href="{{ url_for('sources') }}">Primary Sources</a>
            <a href="{{ url_for('references') }}">References</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
